<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Aegis — Secure Workspace</title>
<style>
  :root{
    --bg:#0a0e16;--bg2:#0f1420;--bg3:#141b2b;--bg4:#1a2334;
    --line:#243149;--line2:#1b2438;
    --text:#e7edf7;--muted:#93a2bd;--faint:#5f6f8c;
    --accent:#8b93ff;--accent2:#5ec7b8;
    --green:#57b98a;--amber:#d7a552;--red:#e0736a;--blue:#6aa6e6;--violet:#a78bfa;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --r:11px;--r2:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1100px 520px at 88% -14%,rgba(139,147,255,.10),transparent 60%),
      radial-gradient(800px 420px at 8% 108%,rgba(94,199,184,.07),transparent 60%),
      var(--bg);
    color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  button,input,select,textarea{font-family:inherit}
  ::selection{background:rgba(139,147,255,.28)}
  a{color:var(--accent);text-decoration:none}

  /* ---------- lock ---------- */
  #lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .vault{width:100%;max-width:430px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:28px 26px;box-shadow:0 24px 60px -30px rgba(0,0,0,.6)}
  .vlogo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e16;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:16px}
  .vbrand{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .vault h1{margin:0 0 4px;font-size:22px;font-weight:660}
  .vault p{color:var(--muted);font-size:13px;margin:8px 0 18px}
  .vault label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px;font-weight:600;letter-spacing:.02em}
  .vault input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s}
  .vault input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,147,255,.14)}
  .vault .err{color:var(--red);font-size:12px;margin-top:10px;min-height:15px}
  .pwmeter{margin-top:10px}
  .pwbar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
  .pwbar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .18s,background .18s}
  .pwmeter span{font-size:11px;color:var(--faint);display:block;margin-top:6px}
  .vault .note{font-size:11px;color:var(--faint);margin-top:16px;line-height:1.55;border-top:1px solid var(--line2);padding-top:13px}
  .vault .dz{margin-top:16px;border-top:1px solid rgba(224,115,106,.28);padding-top:13px}
  .vault .dz h2{font-size:11px;font-weight:700;color:var(--red);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .vault .dz p{font-size:11px;color:var(--faint);margin:0 0 10px}

  /* ---------- buttons ---------- */
  .btn{font-size:13px;font-weight:600;color:#0a0e16;background:var(--accent);border:none;border-radius:9px;padding:9px 15px;cursor:pointer;white-space:nowrap;transition:filter .12s,border-color .12s,color .12s}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{filter:brightness(.96)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--accent)}
  .btn.sm{padding:7px 11px;font-size:12px}
  .btn.block{width:100%;margin-top:18px;padding:12px}
  .btn.danger{color:var(--red);border:1px solid #3a2530;background:transparent}
  .btn.danger:hover{border-color:var(--red)}

  /* ---------- app shell ---------- */
  .shell{display:flex;min-height:100%}
  .sidebar{width:214px;flex:0 0 214px;background:var(--bg2);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e16;display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand b{font-size:15px;font-weight:660;letter-spacing:.01em}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:550;cursor:pointer}
  .nav a:hover{background:var(--bg3);color:var(--text)}
  .nav a.on{background:var(--bg4);color:var(--text)}
  .nav a .ico{width:16px;text-align:center;opacity:.85;font-size:14px}
  .nav a .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);background:var(--bg4);border-radius:6px;padding:1px 6px}
  .nav a.on .ct{background:var(--bg2)}
  .sidefoot{border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:9px}
  .lockpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--green);background:rgba(87,185,138,.10);border:1px solid rgba(87,185,138,.28);border-radius:7px;padding:5px 8px;width:fit-content}
  .lockpill .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(10,14,22,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;padding:14px 24px}
  .topbar h2{margin:0;font-size:18px;font-weight:640}
  .topact{margin-left:auto;display:flex;gap:8px}
  .page{padding:22px 24px 60px;max-width:1180px;width:100%}

  /* ---------- cards / grid ---------- */
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:15px 16px}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .stat .v{font-size:27px;font-weight:680;margin-top:7px;letter-spacing:-.01em}
  .stat .m{font-size:11px;color:var(--muted);margin-top:3px}
  .cols{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px}
  .panel{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:16px}
  .panel h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  .panel h3 .ct{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:600}

  .attention{background:linear-gradient(180deg,rgba(224,115,106,.06),transparent);border:1px solid rgba(224,115,106,.24);border-radius:var(--r);padding:15px 16px}
  .attention.ok{background:linear-gradient(180deg,rgba(87,185,138,.06),transparent);border-color:rgba(87,185,138,.24)}
  .attention h3{color:var(--red)}
  .attention.ok h3{color:var(--green)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .pchip{flex:0 0 auto;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:170px;cursor:pointer}
  .pchip:hover{border-color:var(--accent)}
  .pchip.over{border-color:rgba(224,115,106,.5)}
  .pchip .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .pchip .s{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}

  /* ---------- rows / list ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .toolbar input[type=search],.toolbar select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13px;outline:none}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px}
  .rec{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
  .rec:hover{border-color:var(--line);background:var(--bg3)}
  .rec .tw{min-width:0;flex:1}
  .rec .tt{font-size:14px;font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .meta{font-size:11.5px;color:var(--faint);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .rec .right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:38px 10px;border:1px dashed var(--line);border-radius:var(--r)}

  /* ---------- badges ---------- */
  .pill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid;white-space:nowrap}
  .tag{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--bg4);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}
  .due{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .due.over{color:var(--red)}.due.soon{color:var(--amber)}
  .type{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(6,9,15,.66);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto;z-index:40}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
  .sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
  .sheet .sh h2{margin:0;font-size:16px;font-weight:640;flex:1}
  .sheet .sh .x{cursor:pointer;color:var(--faint);font-size:22px;line-height:1;background:none;border:none;padding:0 4px}
  .sheet .sh .x:hover{color:var(--text)}
  .sbody{padding:18px 20px;max-height:66vh;overflow:auto}
  .sfoot{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--line2)}
  .sfoot .sp{flex:1}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13.5px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:74px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kv{width:100%;border-collapse:collapse;font-size:13px}
  .kv td{padding:8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
  .kv td:first-child{color:var(--muted);width:42%}
  .kv .mono{font-family:var(--mono);font-size:12px;word-break:break-all}

  /* activity */
  .log{display:flex;flex-direction:column;gap:1px;font-size:12.5px}
  .logrow{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line2)}
  .logrow .ts{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;width:150px}
  .logrow .ac{color:var(--muted)}
  .verify{font-size:12px;padding:8px 11px;border-radius:8px;margin-bottom:12px}
  .verify.ok{color:var(--green);background:rgba(87,185,138,.08);border:1px solid rgba(87,185,138,.24)}
  .verify.bad{color:var(--red);background:rgba(224,115,106,.08);border:1px solid rgba(224,115,106,.24)}

  /* toast */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);border:1px solid var(--line);color:var(--text);font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:820px){
    .shell{flex-direction:column}
    .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto}
    .brand{padding:0 8px 0 2px}.brand b{display:none}
    .nav{flex-direction:row;flex:1;gap:2px}
    .nav a .ct{display:none}
    .sidefoot{border-top:none;border-left:1px solid var(--line2);padding:0 0 0 10px;flex-direction:row;align-items:center}
    .lockpill{display:none}
    .row2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock"></div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">AG</span><b>Aegis</b></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidefoot">
        <span class="lockpill"><span class="dot"></span>ENCRYPTED</span>
        <button class="btn ghost sm" data-action="lock">Lock vault</button>
      </div>
    </aside>
    <div class="content">
      <div class="topbar">
        <h2 id="pagetitle">Dashboard</h2>
        <div class="topact" id="topact"></div>
      </div>
      <div class="page" id="page"></div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   Small utilities
========================================================= */
const el = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uuid(){return (crypto.randomUUID&&crypto.randomUUID())||("id-"+Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b=>b.toString(16).padStart(2,"0")).join(""));}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nowISO(){return new Date().toISOString();}
function fmtTs(iso){try{const d=new Date(iso);return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return iso;}}
function ab2b64(buf){let s="",b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b642ab(b64){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer;}
let _toastT=null;
function toast(msg){const t=el("toast");t.textContent=msg;t.classList.add("show");clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove("show"),2200);}

/* =========================================================
   Vault — WebCrypto encryption at rest
========================================================= */
const Vault=(function(){
  const ITER=600000;
  let key=null;
  async function derive(pass,saltArr,iter){
    const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:new Uint8Array(saltArr),iterations:iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  }
  async function encObj(obj,k){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k||key,enc.encode(JSON.stringify(obj)));
    return {v:1,alg:"AES-GCM",iv:Array.from(iv),ct:ab2b64(ct)};
  }
  async function decObj(rec,k){
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(rec.iv)},k||key,b642ab(rec.ct));
    return JSON.parse(dec.decode(pt));
  }
  return {
    ITER,
    async setFrom(pass,saltArr,iter){key=await derive(pass,saltArr,iter||ITER);},
    async deriveAdhoc(pass,saltArr,iter){return derive(pass,saltArr,iter||ITER);},
    enc:o=>encObj(o),
    dec:r=>decObj(r),
    encWith:(o,k)=>encObj(o,k),
    decWith:(r,k)=>decObj(r,k),
    ready:()=>!!key,
    clear:()=>{key=null;}
  };
})();

async function sha256hex(str){
  const buf=await crypto.subtle.digest("SHA-256",enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* =========================================================
   Store — IndexedDB primary, localStorage fallback
========================================================= */
const Store=(function(){
  const DB="aegis_ws",VER=1,ST="vault",PFX="aegis_";
  let dbp=null,failed=false,mode="indexeddb";
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      let r;try{r=indexedDB.open(DB,VER);}catch(e){return rej(e);}
      r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST,{keyPath:"id"});};
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    });
    return dbp;
  }
  function lsGet(id){try{const v=localStorage.getItem(PFX+id);return v?JSON.parse(v):null;}catch(e){return null;}}
  function lsPut(o){localStorage.setItem(PFX+o.id,JSON.stringify(o));}
  async function get(id){
    if(!failed){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction(ST,"readonly").objectStore(ST).get(id);t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});}catch(e){failed=true;mode="local storage (fallback)";}}
    return lsGet(id);
  }
  async function put(o){
    if(!failed){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction(ST,"readwrite").objectStore(ST).put(o);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}catch(e){failed=true;mode="local storage (fallback)";}}
    lsPut(o);
  }
  async function clearAll(){
    try{const db=await open();await new Promise((res)=>{const t=db.transaction(ST,"readwrite").objectStore(ST).clear();t.onsuccess=()=>res();t.onerror=()=>res();});}catch(e){}
    try{Object.keys(localStorage).filter(k=>k.indexOf(PFX)===0).forEach(k=>localStorage.removeItem(k));}catch(e){}
  }
  return {get,put,clearAll,modeName:()=>mode};
})();

/* =========================================================
   Schema — record types / statuses / severities
========================================================= */
const Schema=(function(){
  const TYPES=[
    {k:"risk",label:"Risk",ico:"▲"},
    {k:"vendor",label:"Vendor",ico:"◆"},
    {k:"task",label:"Task",ico:"✓"},
    {k:"project",label:"Project",ico:"❖"},
    {k:"document",label:"Document",ico:"▤"},
    {k:"note",label:"Note",ico:"✎"}
  ];
  const STATUS=[
    {k:"open",label:"Open",c:"var(--blue)"},
    {k:"progress",label:"In progress",c:"var(--violet)"},
    {k:"blocked",label:"Blocked",c:"var(--red)"},
    {k:"done",label:"Done",c:"var(--green)"}
  ];
  const SEV=[
    {k:"low",label:"Low",c:"var(--green)"},
    {k:"med",label:"Medium",c:"var(--amber)"},
    {k:"high",label:"High",c:"var(--red)"},
    {k:"crit",label:"Critical",c:"var(--red)"}
  ];
  const SEVRANK={low:1,med:2,high:3,crit:4};
  const map=(arr)=>{const m={};arr.forEach(x=>m[x.k]=x);return m;};
  const TM=map(TYPES),SM=map(STATUS),VM=map(SEV);
  return {
    TYPES,STATUS,SEV,SEVRANK,
    typeLabel:k=>(TM[k]&&TM[k].label)||k,
    typeIco:k=>(TM[k]&&TM[k].ico)||"•",
    statusLabel:k=>(SM[k]&&SM[k].label)||k,
    statusColor:k=>(SM[k]&&SM[k].c)||"var(--muted)",
    sevLabel:k=>(VM[k]&&VM[k].label)||k,
    sevColor:k=>(VM[k]&&VM[k].c)||"var(--muted)"
  };
})();

/* =========================================================
   App state
========================================================= */
let state=null; // {records:[], audit:[], meta:{}}
let vmeta=null; // {id:"meta", salt, kdf, version, created}
let idleTimer=null, saveTimer=null;
const IDLE_MS=15*60*1000;
const APP_VERSION="2.0";

/* ---- audit log (hash-chained, advisory) ---- */
const Audit=(function(){
  const MAX=5000;
  function log(action,target,details){
    state.audit.push({ts:nowISO(),action,target:target||null,details:details||"",prevHash:null,hash:null});
    if(state.audit.length>MAX)state.audit=state.audit.slice(-MAX);
  }
  function canon(e){return JSON.stringify({ts:e.ts,action:e.action,target:e.target,details:e.details,prevHash:e.prevHash});}
  async function seal(){
    let prev="";
    for(let i=0;i<state.audit.length;i++){if(state.audit[i].hash)prev=state.audit[i].hash;}
    for(let i=0;i<state.audit.length;i++){
      const e=state.audit[i];
      if(e.hash)continue;
      e.prevHash=prev;
      e.hash=await sha256hex(canon(e));
      prev=e.hash;
    }
  }
  async function verify(){
    let prev="";
    for(let i=0;i<state.audit.length;i++){
      const e=state.audit[i];
      if(!e.hash)return {ok:false,at:i};
      if(e.prevHash!==prev)return {ok:false,at:i};
      const h=await sha256hex(canon(e));
      if(h!==e.hash)return {ok:false,at:i};
      prev=e.hash;
    }
    return {ok:true,count:state.audit.length};
  }
  return {log,seal,verify};
})();

/* =========================================================
   Persistence
========================================================= */
async function persist(){
  await Audit.seal();
  const encData=await Vault.enc(state);
  await Store.put({id:"data",enc:encData,updatedAt:nowISO()});
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{persist().catch(e=>toast("Save failed"));},250);
}

/* =========================================================
   Records repository
========================================================= */
const Repo=(function(){
  function get(id){return state.records.find(r=>r.id===id);}
  function create(data){
    const r=Object.assign({
      id:uuid(),type:"note",title:"Untitled",status:"open",severity:"med",
      due:"",owner:"",tags:[],note:"",createdAt:nowISO(),updatedAt:nowISO()
    },data);
    state.records.push(r);
    Audit.log("record.create",{type:r.type,id:r.id,title:r.title});
    return r;
  }
  function update(id,data){
    const r=get(id);if(!r)return;
    Object.assign(r,data,{updatedAt:nowISO()});
    Audit.log("record.update",{type:r.type,id:r.id,title:r.title});
    return r;
  }
  function remove(id){
    const r=get(id);if(!r)return;
    state.records=state.records.filter(x=>x.id!==id);
    Audit.log("record.delete",{type:r.type,id:r.id,title:r.title});
  }
  return {get,create,update,remove};
})();

/* =========================================================
   App controller
========================================================= */
const App=(function(){
  const ROUTES=["dashboard","records","risks","vendors","tasks","settings"];
  const ROUTE_TYPE={risks:"risk",vendors:"vendor",tasks:"task"};

  /* ---------- LOCK ---------- */
  function pwScore(p){
    if(!p)return 0;
    let s=0;
    if(p.length>=14)s++;
    if(p.length>=20)s+=2;
    else{let v=0;if(/[a-z]/.test(p))v++;if(/[A-Z]/.test(p))v++;if(/[0-9]/.test(p))v++;if(/[^a-zA-Z0-9]/.test(p))v++;if(v>=3)s++;}
    return s;
  }
  function pwInfo(p){
    if(!p||p.length<14)return {w:"20%",c:"var(--red)",t:"Too short — 14+ characters"};
    const s=pwScore(p);
    if(s>=3)return {w:"100%",c:"var(--green)",t:"Strong"};
    if(s>=2)return {w:"72%",c:"var(--blue)",t:"Good"};
    return {w:"48%",c:"var(--amber)",t:"Weak — add length or variety"};
  }
  function renderLock(first,errMsg){
    el("app").hidden=true;
    const L=el("lock");L.hidden=false;
    L.innerHTML=
      '<div class="vault">'+
        '<div class="vlogo">AG</div>'+
        '<div class="vbrand">Aegis · Encrypted workspace</div>'+
        '<h1>'+(first?"Create your vault":"Unlock vault")+'</h1>'+
        '<p>'+(first
          ?"Choose a strong passphrase. It derives the encryption key for everything stored on this device. There is no recovery — if you forget it, the data is gone."
          :"Enter your passphrase to decrypt this workspace.")+'</p>'+
        '<label>Passphrase</label>'+
        '<input id="pw" type="password" autocomplete="'+(first?"new-password":"current-password")+'" spellcheck="false">'+
        (first?
          '<div class="pwmeter"><div class="pwbar"><i id="pwfill"></i></div><span id="pwlbl">—</span></div>'+
          '<label>Confirm passphrase</label>'+
          '<input id="pw2" type="password" autocomplete="new-password" spellcheck="false">'
          :'')+
        '<div class="err" id="lerr">'+(errMsg?esc(errMsg):"")+'</div>'+
        '<button class="btn block" data-action="'+(first?"create":"unlock")+'">'+(first?"Create vault":"Unlock")+'</button>'+
        '<div class="note">AES-GCM-256 · PBKDF2-SHA-256 ('+Vault.ITER.toLocaleString()+' iterations). '+
          'Everything is encrypted in your browser and never leaves this device. This is data-at-rest encryption, not an access-control gate.</div>'+
        (first?'':
          '<div class="dz"><h2>Danger zone</h2><p>Forgot your passphrase? You can erase this vault and start fresh. All data is permanently destroyed.</p>'+
          '<button class="btn danger" data-action="wipe">Erase vault &amp; start over</button></div>')+
      '</div>';
    const pw=el("pw");
    if(pw){pw.focus();pw.addEventListener("keydown",e=>{if(e.key==="Enter"){if(first){el("pw2").focus();}else{doUnlock();}}});}
    if(first){
      const upd=()=>{const i=pwInfo(el("pw").value);el("pwfill").style.width=i.w;el("pwfill").style.background=i.c;el("pwlbl").textContent=i.t;el("pwlbl").style.color=i.c;};
      el("pw").addEventListener("input",upd);
      el("pw2").addEventListener("keydown",e=>{if(e.key==="Enter")doCreate();});
    }
  }
  async function doCreate(){
    const p=el("pw").value,p2=el("pw2").value;
    if(p.length<14)return renderLock(true,"Passphrase must be at least 14 characters.");
    if(pwScore(p)<2)return renderLock(true,"Passphrase is too weak. Add length or character variety.");
    if(p!==p2)return renderLock(true,"Passphrases do not match.");
    const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));
    const kdf={algo:"PBKDF2",hash:"SHA-256",iterations:Vault.ITER};
    await Vault.setFrom(p,salt,kdf.iterations);
    vmeta={id:"meta",salt,kdf,version:2,created:nowISO()};
    await Store.put(vmeta);
    state={records:[],audit:[],meta:{version:2,created:nowISO(),deviceId:uuid(),deviceLabel:deviceLabel()}};
    Audit.log("vault.created",null,"New encrypted vault initialized");
    await persist();
    startSession();
  }
  async function doUnlock(){
    const p=el("pw").value;
    if(!p)return;
    try{
      await Vault.setFrom(p,vmeta.salt,(vmeta.kdf&&vmeta.kdf.iterations)||310000);
      const rec=await Store.get("data");
      state=rec?await Vault.dec(rec.enc):{records:[],audit:[],meta:{}};
    }catch(e){
      Vault.clear();
      return renderLock(false,"Incorrect passphrase.");
    }
    if(!state.meta)state.meta={};
    if(!state.meta.deviceId){state.meta.deviceId=uuid();state.meta.deviceLabel=deviceLabel();}
    if(!Array.isArray(state.audit))state.audit=[];
    if(!Array.isArray(state.records))state.records=[];
    Audit.log("vault.unlocked",null,"");
    await persist();
    startSession();
  }
  function deviceLabel(){
    const ua=navigator.userAgent||"";
    let os="Unknown";
    if(/Windows/.test(ua))os="Windows";else if(/Mac OS X|Macintosh/.test(ua))os="macOS";
    else if(/Android/.test(ua))os="Android";else if(/iPhone|iPad/.test(ua))os="iOS";else if(/Linux/.test(ua))os="Linux";
    let br="Browser";
    if(/Edg\//.test(ua))br="Edge";else if(/Chrome\//.test(ua))br="Chrome";else if(/Firefox\//.test(ua))br="Firefox";else if(/Safari\//.test(ua))br="Safari";
    return br+" · "+os;
  }
  async function doWipe(){
    if(!confirm("Erase this vault permanently? All data will be destroyed."))return;
    if(!confirm("This cannot be undone. Continue?"))return;
    if(state){Audit.log("vault.wiped",null,"");try{await persist();}catch(e){}}
    await Store.clearAll();
    Vault.clear();state=null;vmeta=null;
    renderLock(true);
  }

  /* ---------- SESSION ---------- */
  function startSession(){
    el("lock").hidden=true;el("lock").innerHTML="";
    el("app").hidden=false;
    buildNav();
    resetIdle();
    ["mousemove","keydown","click","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
    if(!location.hash||location.hash==="#/unlock")location.hash="#/dashboard";
    route();
  }
  function resetIdle(){if(!Vault.ready())return;clearTimeout(idleTimer);idleTimer=setTimeout(lock,IDLE_MS);}
  function lock(){
    clearTimeout(idleTimer);
    Vault.clear();state=null;
    closeModal();
    el("app").hidden=true;el("page").innerHTML="";
    location.hash="#/unlock";
    renderLock(false);
  }

  /* ---------- NAV / ROUTING ---------- */
  function counts(){
    const c={records:0,risks:0,vendors:0,tasks:0};
    state.records.forEach(r=>{
      c.records++;
      if(r.type==="risk")c.risks++;
      if(r.type==="vendor")c.vendors++;
      if(r.type==="task")c.tasks++;
    });
    return c;
  }
  function buildNav(){
    const c=counts();
    const items=[
      ["dashboard","▦","Dashboard",null],
      ["records","▤","Records",c.records],
      ["risks","▲","Risks",c.risks],
      ["vendors","◆","Vendors",c.vendors],
      ["tasks","✓","Tasks",c.tasks],
      ["settings","⚙","Settings",null]
    ];
    const cur=curRoute();
    el("nav").innerHTML=items.map(it=>
      '<a data-nav="'+it[0]+'" class="'+(it[0]===cur?"on":"")+'"><span class="ico">'+it[1]+'</span>'+it[2]+
      (it[3]!=null?'<span class="ct">'+it[3]+'</span>':'')+'</a>').join("");
  }
  function curRoute(){
    const h=(location.hash||"").replace(/^#\//,"").split("/")[0];
    return ROUTES.indexOf(h)>=0?h:"dashboard";
  }
  function route(){
    if(!Vault.ready())return;
    const r=curRoute();
    buildNav();
    const titles={dashboard:"Dashboard",records:"All records",risks:"Risk register",vendors:"Vendors",tasks:"Tasks & deadlines",settings:"Settings"};
    el("pagetitle").textContent=titles[r]||"Dashboard";
    el("topact").innerHTML=topActions(r);
    ({dashboard:renderDashboard,records:renderList,risks:renderList,vendors:renderList,tasks:renderList,settings:renderSettings}[r]||renderDashboard)(r);
  }
  function topActions(r){
    if(r==="dashboard")return '<button class="btn ghost sm" data-action="activity">Activity log</button>';
    if(r==="settings")return "";
    const t=ROUTE_TYPE[r]||"";
    const label=t?("+ New "+Schema.typeLabel(t).toLowerCase()):"+ New record";
    return '<button class="btn sm" data-action="new" data-type="'+t+'">'+label+'</button>';
  }

  /* ---------- DASHBOARD ---------- */
  function isOverdue(r){return r.due&&r.status!=="done"&&r.due<todayStr();}
  function isSoon(r){if(!r.due||r.status==="done")return false;const diff=(new Date(r.due)-new Date(todayStr()))/86400000;return diff>=0&&diff<=7;}
  function renderDashboard(){
    const R=state.records;
    const attention=R.filter(r=>r.status!=="done"&&(isOverdue(r)||r.status==="blocked"||(r.type==="risk"&&(r.severity==="high"||r.severity==="crit"))))
      .sort((a,b)=>(isOverdue(b)-isOverdue(a))||((Schema.SEVRANK[b.severity]||0)-(Schema.SEVRANK[a.severity]||0)));
    const open=R.filter(r=>r.status!=="done").length;
    const risks=R.filter(r=>r.type==="risk");
    const highRisk=risks.filter(r=>r.status!=="done"&&(r.severity==="high"||r.severity==="crit")).length;
    const overdue=R.filter(isOverdue).length;

    let h="";
    if(attention.length){
      h+='<div class="attention"><h3>Needs attention <span class="ct">'+attention.length+'</span></h3><div class="chips">'+
        attention.slice(0,14).map(r=>
          '<div class="pchip'+(isOverdue(r)?" over":"")+'" data-open="'+r.id+'"><div class="t">'+esc(r.title)+'</div>'+
          '<div class="s">'+badge(r)+(r.due?' <span class="due '+(isOverdue(r)?"over":isSoon(r)?"soon":"")+'">'+esc(r.due)+'</span>':'')+'</div></div>').join("")+
        '</div></div>';
    }else{
      h+='<div class="attention ok"><h3>All clear <span class="ct">0</span></h3><div style="font-size:12.5px;color:var(--muted)">Nothing overdue, blocked, or high-severity right now.</div></div>';
    }
    h+='<div class="grid stats" style="margin-top:14px">'+
      stat("Open items",open,R.length+" total records")+
      stat("Overdue",overdue,overdue?"needs action":"on track")+
      stat("Risks tracked",risks.length,highRisk+" high / critical")+
      stat("Vendors",R.filter(r=>r.type==="vendor").length,"processors & suppliers")+
    '</div>';
    h+='<div class="grid cols">'+
      panel("Risk register",risks.length,
        risks.slice().sort((a,b)=>(Schema.SEVRANK[b.severity]||0)-(Schema.SEVRANK[a.severity]||0)).slice(0,6),
        r=>miniRow(r,'<span class="pill" style="color:'+Schema.sevColor(r.severity)+';border-color:'+Schema.sevColor(r.severity)+'">'+Schema.sevLabel(r.severity)+'</span>'),
        "No risks logged.")+
      panel("Upcoming & due",null,
        R.filter(r=>r.due&&r.status!=="done").sort((a,b)=>a.due<b.due?-1:1).slice(0,6),
        r=>miniRow(r,'<span class="due '+(isOverdue(r)?"over":isSoon(r)?"soon":"")+'">'+esc(r.due)+'</span>'),
        "Nothing scheduled.")+
      panel("Recent activity",null,
        state.audit.slice(-7).reverse(),
        e=>'<div class="rec" style="cursor:default"><div class="tw"><div class="tt" style="font-size:13px">'+esc(actionText(e))+'</div>'+
           '<div class="meta"><span class="due">'+esc(fmtTs(e.ts))+'</span></div></div></div>',
        "No activity yet.")+
    '</div>';
    el("page").innerHTML=h;
  }
  function stat(k,v,m){return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="m">'+esc(m)+'</div></div>';}
  function panel(title,ct,items,rowFn,emptyMsg){
    return '<div class="panel"><h3>'+esc(title)+(ct!=null?' <span class="ct">'+ct+'</span>':'')+'</h3>'+
      (items.length?'<div class="list">'+items.map(rowFn).join("")+'</div>':'<div class="empty">'+esc(emptyMsg)+'</div>')+'</div>';
  }
  function miniRow(r,right){
    return '<div class="rec" data-open="'+r.id+'"><div class="tw"><div class="tt" style="font-size:13px">'+esc(r.title)+'</div>'+
      '<div class="meta"><span class="type">'+esc(Schema.typeLabel(r.type))+'</span></div></div>'+
      '<div class="right">'+(right||"")+'</div></div>';
  }

  /* ---------- LIST (records / risks / vendors / tasks) ---------- */
  let listFilter={q:"",type:"",status:""};
  function renderList(routeName){
    listFilter={q:"",type:"",status:""};
    const forcedType=ROUTE_TYPE[routeName]||"";
    el("page").innerHTML=
      '<div class="toolbar">'+
        '<input type="search" id="q" placeholder="Search title, owner, tags, notes…">'+
        (forcedType?"":'<select id="ftype"><option value="">All types</option>'+Schema.TYPES.map(t=>'<option value="'+t.k+'">'+t.label+'</option>').join("")+'</select>')+
        '<select id="fstatus"><option value="">Any status</option>'+Schema.STATUS.map(s=>'<option value="'+s.k+'">'+s.label+'</option>').join("")+'</select>'+
      '</div><div id="listbody"></div>';
    const rerender=()=>{
      listFilter.q=(el("q").value||"").toLowerCase().trim();
      if(el("ftype"))listFilter.type=el("ftype").value;
      if(el("fstatus"))listFilter.status=el("fstatus").value;
      drawList(forcedType);
    };
    el("q").addEventListener("input",rerender);
    if(el("ftype"))el("ftype").addEventListener("change",rerender);
    el("fstatus").addEventListener("change",rerender);
    drawList(forcedType);
  }
  function drawList(forcedType){
    let rows=state.records.slice();
    if(forcedType)rows=rows.filter(r=>r.type===forcedType);
    if(listFilter.type)rows=rows.filter(r=>r.type===listFilter.type);
    if(listFilter.status)rows=rows.filter(r=>r.status===listFilter.status);
    if(listFilter.q){
      const q=listFilter.q;
      rows=rows.filter(r=>(r.title+" "+r.owner+" "+(r.tags||[]).join(" ")+" "+r.note).toLowerCase().indexOf(q)>=0);
    }
    rows.sort((a,b)=>{
      const ao=isOverdue(a),bo=isOverdue(b);if(ao!==bo)return ao?-1:1;
      if(a.due&&b.due&&a.due!==b.due)return a.due<b.due?-1:1;
      return (b.updatedAt||"").localeCompare(a.updatedAt||"");
    });
    const body=el("listbody");
    if(!rows.length){body.innerHTML='<div class="empty">No matching records. Use the button above to add one.</div>';return;}
    body.innerHTML='<div class="list">'+rows.map(recRow).join("")+'</div>';
  }
  function badge(r){
    return '<span class="pill" style="color:'+Schema.statusColor(r.status)+';border-color:'+Schema.statusColor(r.status)+'">'+Schema.statusLabel(r.status)+'</span>';
  }
  function recRow(r){
    const sev=r.type==="risk"?' <span class="pill" style="color:'+Schema.sevColor(r.severity)+';border-color:'+Schema.sevColor(r.severity)+'">'+Schema.sevLabel(r.severity)+'</span>':'';
    const tags=(r.tags||[]).slice(0,3).map(t=>'<span class="tag">'+esc(t)+'</span>').join(" ");
    return '<div class="rec" data-open="'+r.id+'">'+
      '<div class="tw"><div class="tt">'+esc(r.title)+'</div>'+
        '<div class="meta"><span class="type">'+Schema.typeIco(r.type)+' '+esc(Schema.typeLabel(r.type))+'</span>'+
        (r.owner?'<span>'+esc(r.owner)+'</span>':'')+
        (r.due?'<span class="due '+(isOverdue(r)?"over":isSoon(r)?"soon":"")+'">⧗ '+esc(r.due)+'</span>':'')+
        tags+'</div></div>'+
      '<div class="right">'+sev+badge(r)+'</div></div>';
  }

  /* ---------- RECORD MODAL ---------- */
  function openRecord(id,presetType){
    const r=id?Repo.get(id):null;
    const rec=r||{type:presetType||"note",title:"",status:"open",severity:"med",due:"",owner:"",tags:[],note:""};
    const sheet=el("sheet");
    sheet.innerHTML=
      '<div class="sh"><h2>'+(r?"Edit record":"New record")+'</h2><button class="x" data-action="closeModal">×</button></div>'+
      '<div class="sbody">'+
        '<div class="field"><label>Title</label><input id="f_title" value="'+esc(rec.title)+'" placeholder="Short, descriptive title"></div>'+
        '<div class="row2">'+
          '<div class="field"><label>Type</label><select id="f_type">'+Schema.TYPES.map(t=>'<option value="'+t.k+'"'+(t.k===rec.type?" selected":"")+'>'+t.label+'</option>').join("")+'</select></div>'+
          '<div class="field"><label>Status</label><select id="f_status">'+Schema.STATUS.map(s=>'<option value="'+s.k+'"'+(s.k===rec.status?" selected":"")+'>'+s.label+'</option>').join("")+'</select></div>'+
        '</div>'+
        '<div class="row2">'+
          '<div class="field" id="sevwrap"'+(rec.type==="risk"?"":' hidden')+'><label>Severity</label><select id="f_sev">'+Schema.SEV.map(s=>'<option value="'+s.k+'"'+(s.k===rec.severity?" selected":"")+'>'+s.label+'</option>').join("")+'</select></div>'+
          '<div class="field"><label>Due / review date</label><input id="f_due" type="date" value="'+esc(rec.due)+'"></div>'+
        '</div>'+
        '<div class="row2">'+
          '<div class="field"><label>Owner</label><input id="f_owner" value="'+esc(rec.owner)+'" placeholder="Responsible person"></div>'+
          '<div class="field"><label>Tags (comma-separated)</label><input id="f_tags" value="'+esc((rec.tags||[]).join(", "))+'" placeholder="pdpl, iso27001"></div>'+
        '</div>'+
        '<div class="field"><label>Notes</label><textarea id="f_note" placeholder="Details, context, evidence links…">'+esc(rec.note)+'</textarea></div>'+
        (r?'<table class="kv"><tr><td>Created</td><td class="mono">'+esc(fmtTs(r.createdAt))+'</td></tr><tr><td>Updated</td><td class="mono">'+esc(fmtTs(r.updatedAt))+'</td></tr><tr><td>ID</td><td class="mono">'+esc(r.id)+'</td></tr></table>':'')+
      '</div>'+
      '<div class="sfoot">'+
        (r?'<button class="btn danger" data-action="delRecord" data-id="'+r.id+'">Delete</button>':'')+
        '<span class="sp"></span>'+
        '<button class="btn ghost" data-action="closeModal">Cancel</button>'+
        '<button class="btn" data-action="saveRecord" data-id="'+(r?r.id:"")+'">Save</button>'+
      '</div>';
    el("modal").hidden=false;
    el("f_type").addEventListener("change",()=>{el("sevwrap").hidden=el("f_type").value!=="risk";});
    setTimeout(()=>el("f_title").focus(),30);
  }
  function saveRecord(id){
    const title=el("f_title").value.trim();
    if(!title){toast("Title is required");el("f_title").focus();return;}
    const data={
      title,
      type:el("f_type").value,
      status:el("f_status").value,
      severity:el("f_sev")?el("f_sev").value:"med",
      due:el("f_due").value,
      owner:el("f_owner").value.trim(),
      tags:el("f_tags").value.split(",").map(s=>s.trim()).filter(Boolean),
      note:el("f_note").value
    };
    if(id)Repo.update(id,data);else Repo.create(data);
    save();closeModal();route();toast(id?"Saved":"Record created");
  }
  function delRecord(id){
    if(!confirm("Delete this record permanently?"))return;
    Repo.remove(id);save();closeModal();route();toast("Deleted");
  }

  /* ---------- ACTIVITY LOG ---------- */
  function actionText(e){
    const t=e.target;
    const map={
      "vault.created":"Vault created","vault.unlocked":"Vault unlocked","vault.wiped":"Vault erased",
      "record.create":"Created","record.update":"Updated","record.delete":"Deleted",
      "backup.export":"Backup exported","backup.restore":"Backup restored","log.export":"Activity exported"
    };
    let base=map[e.action]||e.action;
    if(t&&t.title)return base+' “'+t.title+'” ('+Schema.typeLabel(t.type)+')';
    return base+(e.details?" — "+e.details:"");
  }
  async function openActivity(){
    const sheet=el("sheet");
    clearTimeout(saveTimer);
    await persist();           // flush + seal any pending entries before verifying
    const v=await Audit.verify();
    const rows=state.audit.slice().reverse();
    sheet.innerHTML=
      '<div class="sh"><h2>Activity log</h2><button class="x" data-action="closeModal">×</button></div>'+
      '<div class="sbody">'+
        '<div class="verify '+(v.ok?"ok":"bad")+'">'+(v.ok?"✓ Integrity verified — hash chain intact ("+v.count+" entries)":"✗ Integrity check failed at entry "+v.at)+'</div>'+
        (rows.length?'<div class="log">'+rows.map(e=>
          '<div class="logrow"><span class="ts">'+esc(fmtTs(e.ts))+'</span><span class="ac">'+esc(actionText(e))+'</span></div>').join("")+'</div>'
          :'<div class="empty">No activity recorded.</div>')+
      '</div>'+
      '<div class="sfoot"><span class="sp"></span><button class="btn ghost" data-action="exportLog">Export CSV</button><button class="btn" data-action="closeModal">Close</button></div>';
    el("modal").hidden=false;
  }
  function exportLog(){
    const head="timestamp,action,target_type,target_title,details\n";
    const body=state.audit.map(e=>[e.ts,e.action,(e.target&&e.target.type)||"",(e.target&&e.target.title)||"",e.details||""]
      .map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
    download("aegis-activity-"+todayStr()+".csv","text/csv",head+body);
    Audit.log("log.export",null,state.audit.length+" entries");save();toast("Exported activity log");
  }

  /* ---------- SETTINGS ---------- */
  function renderSettings(){
    const m=state.meta||{};
    el("page").innerHTML=
      '<div class="grid cols" style="margin-top:0">'+
        '<div class="panel"><h3>Backup &amp; restore</h3>'+
          '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Export an encrypted backup file, or import one into this vault. Backups are encrypted with your current passphrase.</p>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-action="backup">Export encrypted backup</button>'+
          '<button class="btn ghost sm" data-action="importPick">Import backup…</button></div>'+
          '<input type="file" id="fileimport" accept="application/json,.json" hidden>'+
        '</div>'+
        '<div class="panel"><h3>Security</h3><table class="kv">'+
          '<tr><td>Encryption</td><td>AES-GCM-256</td></tr>'+
          '<tr><td>Key derivation</td><td>PBKDF2-SHA-256</td></tr>'+
          '<tr><td>Iterations</td><td class="mono">'+((vmeta&&vmeta.kdf&&vmeta.kdf.iterations)||Vault.ITER).toLocaleString()+'</td></tr>'+
          '<tr><td>Storage</td><td>'+esc(Store.modeName())+'</td></tr>'+
          '<tr><td>Auto-lock</td><td>15 min idle</td></tr>'+
        '</table></div>'+
        '<div class="panel"><h3>This device</h3><table class="kv">'+
          '<tr><td>Label</td><td>'+esc(m.deviceLabel||deviceLabel())+'</td></tr>'+
          '<tr><td>Device ID</td><td class="mono">'+esc(m.deviceId||"—")+'</td></tr>'+
          '<tr><td>Vault created</td><td class="mono">'+esc(m.created?fmtTs(m.created):(vmeta?fmtTs(vmeta.created):"—"))+'</td></tr>'+
          '<tr><td>Records</td><td>'+state.records.length+'</td></tr>'+
          '<tr><td>Log entries</td><td>'+state.audit.length+'</td></tr>'+
        '</table></div>'+
        '<div class="panel" style="border-color:rgba(224,115,106,.3)"><h3 style="color:var(--red)">Danger zone</h3>'+
          '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Permanently erase this vault and all its data from this device. This cannot be undone.</p>'+
          '<button class="btn danger" data-action="wipe">Erase vault</button></div>'+
      '</div>';
    el("fileimport").addEventListener("change",onImportFile);
  }
  async function backup(){
    const payload=await Vault.enc(state);
    const env={format:"aegis-backup",v:2,encrypted:true,exported:nowISO(),app:APP_VERSION,
      device:{id:state.meta.deviceId,label:state.meta.deviceLabel},
      kdf:vmeta.kdf,salt:vmeta.salt,payload};
    download("aegis-backup-"+todayStr()+".enc.json","application/json",JSON.stringify(env,null,2));
    Audit.log("backup.export",null,"encrypted");save();toast("Backup exported");
  }
  function onImportFile(ev){
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    if(f.size>25*1024*1024){toast("File too large (max 25 MB)");ev.target.value="";return;}
    const rd=new FileReader();
    rd.onload=()=>{
      let env;try{env=JSON.parse(rd.result);}catch(e){toast("Not a valid JSON backup");ev.target.value="";return;}
      ev.target.value="";
      openRestore(env);
    };
    rd.readAsText(f);
  }
  function openRestore(env){
    const encrypted=!!(env&&env.encrypted&&env.payload);
    const sheet=el("sheet");
    sheet.innerHTML=
      '<div class="sh"><h2>Restore backup</h2><button class="x" data-action="closeModal">×</button></div>'+
      '<div class="sbody">'+
        '<p style="font-size:12.5px;color:var(--muted);margin-top:0">Restoring <b>replaces</b> the current vault contents with the backup. Exported '+
          esc(env&&env.exported?fmtTs(env.exported):"unknown")+'.</p>'+
        (encrypted?'<div class="field"><label>Backup passphrase</label><input id="r_pw" type="password" spellcheck="false" placeholder="Passphrase used when exporting"></div>'
          :'<p style="font-size:12px;color:var(--amber)">This backup is not encrypted.</p>')+
        '<div class="err" id="r_err"></div>'+
      '</div>'+
      '<div class="sfoot"><span class="sp"></span><button class="btn ghost" data-action="closeModal">Cancel</button>'+
      '<button class="btn" id="r_go">Restore</button></div>';
    el("modal").hidden=false;
    el("r_go").addEventListener("click",()=>doRestore(env,encrypted));
    if(el("r_pw"))el("r_pw").focus();
  }
  async function doRestore(env,encrypted){
    let data;
    try{
      if(encrypted){
        const pw=el("r_pw").value;
        const k=await Vault.deriveAdhoc(pw,env.salt,(env.kdf&&env.kdf.iterations)||Vault.ITER);
        data=await Vault.decWith(env.payload,k);
      }else{
        data=env.state||env;
      }
    }catch(e){el("r_err").textContent="Could not decrypt — wrong passphrase or corrupt file.";return;}
    if(!data||!Array.isArray(data.records)){el("r_err").textContent="Backup does not contain valid records.";return;}
    state.records=data.records;
    Audit.log("backup.restore",null,data.records.length+" records");
    await persist();closeModal();route();toast("Backup restored — "+data.records.length+" records");
  }

  /* ---------- helpers ---------- */
  function download(name,mime,content){
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
  }
  function closeModal(){el("modal").hidden=true;el("sheet").innerHTML="";}

  /* ---------- event delegation ---------- */
  function onClick(e){
    const nav=e.target.closest("[data-nav]");
    if(nav){location.hash="#/"+nav.getAttribute("data-nav");return;}
    const open=e.target.closest("[data-open]");
    if(open&&Vault.ready()){openRecord(open.getAttribute("data-open"));return;}
    const a=e.target.closest("[data-action]");
    if(!a)return;
    const act=a.getAttribute("data-action"),id=a.getAttribute("data-id"),type=a.getAttribute("data-type");
    switch(act){
      case "create":doCreate();break;
      case "unlock":doUnlock();break;
      case "wipe":doWipe();break;
      case "lock":lock();break;
      case "new":openRecord(null,type);break;
      case "saveRecord":saveRecord(id);break;
      case "delRecord":delRecord(id);break;
      case "closeModal":closeModal();break;
      case "activity":openActivity();break;
      case "exportLog":exportLog();break;
      case "backup":backup();break;
      case "importPick":el("fileimport").click();break;
    }
  }

  function boot(){
    document.addEventListener("click",onClick);
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el("modal").hidden)closeModal();});
    window.addEventListener("hashchange",()=>{if(Vault.ready())route();});
    (async ()=>{
      vmeta=await Store.get("meta");
      renderLock(!vmeta);
    })();
  }
  return {boot};
})();

App.boot();

})();
</script>
</body>
</html>
