<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CISO Workspace — v1 (secure foundation)</title>
<style>
  :root{
    --ink:#0c1424;--ink2:#0f1a2e;--ink3:#13213a;--ink4:#16243f;
    --line:#213149;--line2:#1a2740;--text:#e8eef6;--muted:#93a4bd;--faint:#5d6f8c;
    --accent:#8fb8e8;--green:#5fae86;--amber:#d8a24f;--red:#d8685f;--blue:#6fa3dd;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--r:9px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1000px 480px at 82% -12%,rgba(143,184,232,.08),transparent 60%),var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  button,input,select,textarea{font-family:inherit}
  /* lock */
  #lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .vault{width:100%;max-width:420px;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
  .vlogo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px;margin-bottom:14px}
  .vbrand{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .vbrand .ar{font-family:var(--sans);letter-spacing:0}
  .vault h1{margin:0 0 4px;font-size:21px;font-weight:650}
  .vault .ar{color:var(--muted);font-weight:600;font-size:15px;margin-left:5px}
  .vault p{color:var(--muted);font-size:13px;margin:8px 0 16px}
  .vault label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .vault input{width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);font-size:14px;outline:none}
  .vault input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,184,232,.12)}
  .vault .err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px}
  .pwmeter{margin-top:8px}
  .pwbar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
  .pwbar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .15s,background .15s}
  .pwmeter span{font-size:11px;color:var(--faint);display:block;margin-top:5px}
  .vault .note{font-size:11px;color:var(--faint);margin-top:14px;line-height:1.5;border-top:1px solid var(--line2);padding-top:12px}
  .btn{font-size:13px;font-weight:600;color:var(--ink);background:var(--accent);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--accent)}
  .btn.sm{padding:7px 10px;font-size:12px}
  .btn.block{width:100%;margin-top:16px;padding:11px}
  .btn.danger{color:var(--red);border-color:#3a2530;background:transparent}
  /* app */
  #app{min-height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line2);background:rgba(15,26,46,.5)}
  header h1{margin:0;font-size:16px;font-weight:650}
  header h1 .ar{color:var(--muted);font-size:13px;font-weight:600;margin-left:4px}
  .sub{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:1px}
  .spacer{flex:1}
  .lockpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:#9bd3b1;background:rgba(95,174,134,.08);border:1px solid rgba(95,174,134,.28);padding:5px 8px;border-radius:999px}
  .lockpill .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  main{flex:1;padding:14px 16px;max-width:1080px;width:100%;margin:0 auto}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar select,.toolbar input{background:var(--ink3);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font-size:13px;outline:none}
  .toolbar input{flex:1;min-width:150px}
  .toolbar select:focus,.toolbar input:focus{border-color:var(--accent)}
  .banner{display:flex;align-items:center;gap:10px;background:rgba(216,162,79,.08);border:1px solid rgba(216,162,79,.4);border-radius:var(--r);padding:9px 12px;margin-bottom:12px;font-size:13px;color:var(--amber)}
  .list{display:flex;flex-direction:column;gap:8px}
  .rec{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
  .rec:hover{border-color:var(--accent)}
  .rline{display:flex;align-items:center;gap:9px}
  .ttag{font-family:var(--mono);font-size:9px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 5px;flex:none;text-transform:uppercase}
  .rtitle{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec.done .rtitle{color:var(--faint);text-decoration:line-through}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap;flex:none}
  .pill .dot{width:6px;height:6px;border-radius:50%}
  .due{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;flex:none}
  .due.over{color:var(--red)}.due.soon{color:var(--amber)}
  .meta2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
  .ctag{font-size:10px;font-weight:600;color:var(--accent);background:rgba(143,184,232,.1);border:1px solid rgba(143,184,232,.3);border-radius:5px;padding:2px 7px}
  .lk{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .empty{color:var(--faint);font-size:13px;padding:24px 4px;text-align:center}
  .sev{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;flex:none;border:1px solid transparent}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(6,11,22,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  .sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:16px}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:15px;font-weight:650}
  .x{border:none;background:none;color:var(--faint);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1}
  .x:hover{color:var(--red);background:rgba(216,104,95,.1)}
  .sheet label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .sheet input,.sheet select,.sheet textarea{width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13.5px;outline:none}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,184,232,.12)}
  .sheet textarea{min-height:52px;resize:vertical}
  .sheet input[type=date]{font-family:var(--mono);font-size:12.5px;color-scheme:dark}
  .frow{display:flex;gap:10px}.frow>div{flex:1}
  .frow.tight{align-items:flex-end}.frow.tight .btn{margin-bottom:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);background:rgba(143,184,232,.1);border:1px solid rgba(143,184,232,.3);border-radius:6px;padding:3px 8px}
  .chip b{font-weight:600}
  .chip button{border:none;background:none;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
  .chip button:hover{color:var(--red)}
  .linkitem{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line2)}
  .linkitem:first-child{border-top:none}
  .linkitem .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .errbox{color:var(--red);font-size:12px;margin-top:10px}
  .mfoot{display:flex;align-items:center;gap:8px;margin-top:16px}
  .seclabel{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
  .ae{padding:8px 4px;border-top:1px solid var(--line2);font-size:12.5px}
  .ae:first-child{border-top:none}
  .ae .at{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .backlinks{margin-top:6px;font-size:12px;color:var(--muted)}
  .shell{display:flex;align-items:stretch;height:100vh;overflow:hidden}
  .sidebar{width:204px;flex:none;align-self:stretch;position:sticky;top:0;height:100vh;box-sizing:border-box;border-right:1px solid var(--line2);background:rgba(15,26,46,.55);display:flex;flex-direction:column;padding:14px 10px}
  .sidebar .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
  .sidebar .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .sidebar .bn{font-size:13.5px;font-weight:650}
  .sidebar .ar{font-size:11px;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
  .nav a{display:block;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500}
  .nav a:hover{background:var(--ink3);color:var(--text)}
  .nav a.on{background:var(--accent);color:var(--ink);font-weight:600}
  .sidefoot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line2)}
  .content{flex:1;min-width:0;box-sizing:border-box;padding:0 20px 24px;max-width:1040px;height:100vh;overflow-y:auto}
  .topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:16px 0 12px;background:linear-gradient(var(--ink) 80%,transparent)}
  .topbar h2{margin:0;font-size:18px;font-weight:650}
  .topactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:650}
  .card.danger-zone{border-color:rgba(216,104,95,.45);background:rgba(216,104,95,.05)}
  .card.danger-zone h3{color:var(--red)}
  .muted{color:var(--muted);font-size:12.5px}
  .srow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .kv{width:100%;font-size:13px;border-collapse:collapse;margin-top:4px}
  .kv td{padding:7px 0;border-top:1px solid var(--line2)}
  .kv td:first-child{color:var(--muted);width:45%}
  .kv tr:first-child td{border-top:none}
  @media (max-width:760px){
    .shell{flex-direction:column;height:100vh;overflow:hidden}
    .sidebar{position:static;height:auto;width:auto;flex:none;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line2);overflow-x:auto;padding:8px 10px}
    .sidebar .brand{padding:0 8px 0 2px}.sidebar .ar{display:none}.sidebar .bn{font-size:12.5px}
    .nav{flex-direction:row;gap:4px;overflow:visible}
    .nav a{white-space:nowrap;padding:7px 10px}
    .sidefoot{flex-direction:row;border-top:none;padding-top:0;margin-left:auto}
    .content{height:auto;flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px;max-width:none}
    .topbar{padding:12px 0 10px}
  }
  .d-pending{border:1px solid var(--line);border-radius:var(--r);background:var(--ink2);padding:9px 12px;margin-bottom:12px}
  .d-pending.alert{border-color:rgba(216,162,79,.45);background:rgba(216,162,79,.07)}
  .d-pending.crit{border-color:rgba(216,104,95,.5);background:rgba(216,104,95,.08)}
  .d-pending .ptitle{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--amber);margin-bottom:7px}
  .d-pending.crit .ptitle{color:var(--red)}
  .pchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .pchip{flex:none;cursor:pointer;border:1px solid;border-radius:8px;padding:6px 10px;max-width:250px}
  .pchip .pt{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:228px}
  .pchip .pm{font-family:var(--mono);font-size:9.5px}
  .d-clear{color:var(--green);font-size:12.5px}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .dpanel{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .dpanel .ph{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:rgba(222,234,246,.05);border-bottom:1px solid rgba(222,234,246,.12)}
  .dpanel .ph .t{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .dpanel .ph .c{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .dpanel .pb{max-height:340px;overflow:auto;padding:6px 8px}
  .drow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:7px;cursor:pointer}
  .drow:hover{background:var(--ink3)}
  .drow.done .dt{color:var(--faint);text-decoration:line-through}
  .drow .dt{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){.dgrid{grid-template-columns:1fr}}
  @media (max-width:620px){header h1{font-size:15px}.clock{display:none}}
</style>
</head>
<body>
<div id="lock"></div>

<div id="app" hidden>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">CW</span><div><div class="bn">CISO Workspace</div><div class="ar" dir="rtl" lang="ar">مساحة العمل</div></div></div>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/records" data-nav="records">Records</a>
        <a href="#/vendors" data-nav="vendors">Vendors</a>
        <a href="#/risks" data-nav="risks">Risks</a>
        <a href="#/tasks" data-nav="tasks">Tasks</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="sidefoot">
        <span class="lockpill" id="lockpill" title="Vault encrypted with your passphrase (AES-GCM). Data at rest is ciphertext."><span class="dot"></span>ENCRYPTED</span>
        <button class="btn ghost sm" data-action="lock">Lock vault</button>
      </div>
    </aside>
    <section class="content">
      <div class="topbar"><h2 id="pagetitle">Dashboard</h2><div class="topactions" id="topactions"></div></div>
      <div id="stagebar"></div>
      <div id="page"></div>
    </section>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ============================================================
   CISO Workspace — v1 secure foundation
   Modules: Vault · Store · Schema · Repo · Audit · Authz · App
   Each module is a seam. The Store/Authz/Audit interfaces are
   what a backend implements later (see SECURITY.md) — no rebuild.
   ============================================================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));}
function now(){return new Date().toISOString();}
function $(s,r){return (r||document).querySelector(s);}
function ab2b64(buf){var b="",x=new Uint8Array(buf);for(var i=0;i<x.length;i++)b+=String.fromCharCode(x[i]);return btoa(b);}
function b642ab(s){var bin=atob(s),x=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)x[i]=bin.charCodeAt(i);return x.buffer;}

/* ---------- Vault: encryption at rest (WebCrypto) ---------- */
var Vault=(function(){
  var key=null,E=new TextEncoder(),D=new TextDecoder(),ITER=600000;
  async function derive(pass,salt,iters){
    var base=await crypto.subtle.importKey("raw",E.encode(pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iters||ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  }
  async function enc(obj){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,E.encode(JSON.stringify(obj)));
    return {v:1,alg:"AES-GCM",iv:Array.from(iv),ct:ab2b64(ct)};
  }
  async function dec(rec){
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(rec.iv)},key,b642ab(rec.ct));
    return JSON.parse(D.decode(pt));
  }
  async function decWith(rec,k){
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(rec.iv)},k,b642ab(rec.ct));
    return JSON.parse(D.decode(pt));
  }
  return {ITER:ITER,derive:derive,enc:enc,dec:dec,decWith:decWith,set:function(k){key=k;},clear:function(){key=null;},ready:function(){return !!key;}};
})();

/* ---------- Store: persistence seam (IndexedDB, ls fallback) ---------- */
var Store=(function(){
  var DB="ciso_ws",VER=1,OS="vault",failed=false,mode="IndexedDB";
  function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open(DB,VER);r.onupgradeneeded=function(){r.result.createObjectStore(OS,{keyPath:"id"});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
  async function lsGet(id){try{if(window.storage&&window.storage.get){var r=await window.storage.get("ws_"+id);return r?JSON.parse(r.value):null;}}catch(e){}try{var v=localStorage.getItem("ws_"+id);return v?JSON.parse(v):null;}catch(e){return null;}}
  async function lsPut(rec){var s=JSON.stringify(rec);try{if(window.storage&&window.storage.set){await window.storage.set("ws_"+rec.id,s);return;}}catch(e){}try{localStorage.setItem("ws_"+rec.id,s);}catch(e){}}
  async function lsClear(){var ids=["meta","data"];for(var i=0;i<ids.length;i++){try{if(window.storage&&window.storage.delete)await window.storage.delete("ws_"+ids[i]);}catch(e){}try{localStorage.removeItem("ws_"+ids[i]);}catch(e){}}}
  async function get(id){if(!failed){try{var db=await idb();return await new Promise(function(res,rej){var t=db.transaction(OS,"readonly").objectStore(OS).get(id);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){rej(t.error);};});}catch(e){failed=true;mode="local storage (fallback)";}}return lsGet(id);}
  async function put(rec){if(!failed){try{var db=await idb();return await new Promise(function(res,rej){var tx=db.transaction(OS,"readwrite");tx.objectStore(OS).put(rec);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}catch(e){failed=true;mode="local storage (fallback)";}}return lsPut(rec);}
  async function clearAll(){if(!failed){try{var db=await idb();await new Promise(function(res,rej){var tx=db.transaction(OS,"readwrite");tx.objectStore(OS).clear();tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}catch(e){failed=true;}}await lsClear();}
  return {get:get,put:put,clearAll:clearAll,mode:function(){return mode;}};
})();

/* ---------- Schema: types, validation, frameworks ---------- */
var Schema={
  types:[["document","Document"],["vendor","Vendor / processor"],["risk","Risk"],["project","Project"],["task","Task / deadline"],["person","Person (JML)"],["note","Note"]],
  statuses:[["open","Open"],["progress","In progress"],["blocked","Blocked"],["done","Done"]],
  severities:[["low","Low"],["med","Medium"],["high","High"],["crit","Critical"]],
  frameworks:["PDPL","CMA","NCA ECC","ISO 27001","Internal"],
  typeLabel:function(t){var f=this.types.filter(function(x){return x[0]===t;})[0];return f?f[1]:t;},
  statusLabel:function(s){var f=this.statuses.filter(function(x){return x[0]===s;})[0];return f?f[1]:s;},
  statusColor:function(s){return {open:"#7e90a8",progress:"#6fa3dd",blocked:"#d8685f",done:"#5fae86"}[s]||"#7e90a8";},
  sevLabel:function(s){var f=this.severities.filter(function(x){return x[0]===s;})[0];return f?f[1]:s;},
  sevColor:function(s){return {low:"#6cae86",med:"#d8c45f",high:"#e0915b",crit:"#d8685f"}[s]||"#d8c45f";},
  validate:function(r){
    var e=[];
    if(!r.title||!String(r.title).trim())e.push("Title is required.");

  }
  function renderRefs(){
    $("#cf-list").innerHTML=work.refs.length?work.refs.map(function(c,i){return '<span class="chip"><b>'+esc(c.fw)+'</b>'+(c.ref?' '+esc(c.ref):'')+'<button data-action="cf-del" data-i="'+i+'" aria-label="remove">×</button></span>';}).join(""):'<span class="lk" style="color:var(--faint);font-size:11px">No tags yet — link this to PDPL, CMA, NCA ECC, ISO 27001 or an internal control.</span>';
  }
  function renderLinkSel(){
    var opts=state.records.filter(function(x){return x.id!==editingId&&work.links.indexOf(x.id)<0;}).map(function(x){return '<option value="'+x.id+'">'+esc(Schema.typeLabel(x.type))+": "+esc(x.title)+'</option>';}).join("");
    $("#lk-sel").innerHTML=opts||'<option value="">— no other records —</option>';
  }
  function renderLinks(){
    $("#lk-list").innerHTML=work.links.length?work.links.map(function(id){var t=Repo.get(state,id);return '<div class="linkitem"><span class="ttag">'+esc(t?t.type:"?")+'</span><span class="lt">'+esc(t?t.title:"(missing)")+'</span><button class="x" data-action="lk-del" data-id="'+id+'" style="font-size:16px">×</button></div>';}).join(""):'<span class="lk" style="color:var(--faint);font-size:11px">Not linked to anything yet.</span>';
  }
  function renderBacklinks(id){var bl=Repo.backlinks(state,id);$("#backlinks").innerHTML=bl.length?'Referenced by: '+bl.map(function(x){return esc(x.title);}).join(", "):"";}

  function saveModal(){
    var data={
      title:$("#f-title").value.trim(),type:$("#f-type").value,status:$("#f-status").value,
      due:$("#f-due").value,owner:$("#f-owner").value.trim(),note:$("#f-note").value.trim(),
      severity:$("#f-type").value==="risk"?$("#f-sev").value:"",
      complianceRefs:work.refs,links:work.links
    };
    var errs=Schema.validate(data);
    if(errs.length){$("#m-err").innerHTML=errs.map(esc).join("<br>");return;}
    if(!Authz.can(editingId?"update":"create",data)){denied();return;}
    if(editingId){Repo.update(state,editingId,data);Audit.log(state,"record.update",data.type+": "+data.title);}
    else{var r=Repo.create(state,data);Audit.log(state,"record.create",data.type+": "+data.title);editingId=r.id;}
    closeModal();render();save();
  }
  function delRecord(){if(!editingId)return;var r=Repo.get(state,editingId);if(!Authz.can("delete",r)){denied();return;}if(!confirm("Delete this record? This also removes links to it."))return;Repo.remove(state,editingId);Audit.log(state,"record.delete",(r?r.type+": "+r.title:""));closeModal();render();save();}
  function closeModal(){$("#modal").classList.remove("open");editingId=null;work=null;pendingRestore=null;}

  /* ----- activity ----- */
  function openActivity(){
    var items=state.audit.slice().reverse().slice(0,300);
    $("#sheet").innerHTML='<div class="mhead"><span>Activity log</span><button class="x" data-action="m-close">×</button></div>'
      +'<div class="lk" style="color:var(--faint);font-size:11px;margin-bottom:8px">Append-only. Trustworthy to the extent this device is trusted; a tamper-evident server audit arrives with hosting.</div>'
      +(items.length?items.map(function(a){return '<div class="ae"><span class="at">'+esc(new Date(a.ts).toLocaleString())+'</span> · '+esc(a.action)+(a.detail?' — '+esc(a.detail):'')+'</div>';}).join(""):'<div class="empty">No activity yet.</div>');
    $("#modal").classList.add("open");
  }

  /* ----- staging review ----- */
  function openStaging(){
    var s=state.staging;
    $("#sheet").innerHTML='<div class="mhead"><span>Review imported records</span><button class="x" data-action="m-close">×</button></div>'
      +'<div class="lk" style="color:var(--faint);font-size:11px;margin-bottom:8px">Imported data is untrusted until committed. Review, then commit or discard.</div>'
      +(s.length?s.map(function(it,i){return '<div class="linkitem"><span class="ttag">'+esc(it.type||"task")+'</span><span class="lt">'+esc(it.title||"(no title)")+'</span><button class="btn sm" data-action="stage-commit" data-i="'+i+'">Commit</button> <button class="x" data-action="stage-discard" data-i="'+i+'" style="font-size:16px">×</button></div>';}).join(""):'<div class="empty">Nothing staged.</div>')
      +(s.length?'<div class="mfoot"><button class="btn ghost sm danger" data-action="stage-clear">Discard all</button><span class="spacer"></span><button class="btn sm" data-action="stage-commitall">Commit all</button></div>':'');
    $("#modal").classList.add("open");
  }
  function commitStaged(i){var it=state.staging[i];if(!it)return;if(!Authz.can("create",it)){denied();return;}Repo.create(state,sanitizeImport(it));state.staging.splice(i,1);Audit.log(state,"import.commit",(it.title||""));openStaging();render();save();}
  function commitAllStaged(){if(!Authz.can("create",null)){denied();return;}state.staging.forEach(function(it){Repo.create(state,sanitizeImport(it));});Audit.log(state,"import.commit_all",state.staging.length+" records");state.staging=[];closeModal();render();save();}
  function sanitizeImport(it){
    return {
      title:String(it.title||"").slice(0,200),
      type:Schema.types.some(function(x){return x[0]===it.type;})?it.type:"note",
      status:Schema.statuses.some(function(x){return x[0]===it.status;})?it.status:"open",
      due:(it.due&&!isNaN(Date.parse(it.due)))?String(it.due).slice(0,10):"",
      owner:String(it.owner||"").slice(0,80),
      note:String(it.note||"").slice(0,5000),
      severity:"",complianceRefs:[],links:[]
    };
  }

  /* ----- backup / restore ----- */
  async function backup(){
    if(!Authz.can("export",null)){denied();return;}
    var enc=await Vault.enc(state);
    var out={format:"ciso-ws-backup",v:2,encrypted:true,exported:now(),kdf:(vmeta&&vmeta.kdf)||{algo:"PBKDF2",hash:"SHA-256",iterations:Vault.ITER},salt:(vmeta&&vmeta.salt)||null,payload:enc};
    var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="ciso-ws-backup-"+now().slice(0,10)+".enc.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
    Audit.log(state,"backup.export","encrypted");save();
  }
  function stageRecords(recs){
    if(!recs||!recs.length){alert("No records found in that backup.");return;}
    if(!Authz.can("import",null)){denied();return;}
    if(!confirm(recs.length+" record(s) found. They will be staged for review, not merged directly. Continue?"))return;
    recs.forEach(function(r){state.staging.push(r);});
    Audit.log(state,"import.restore_staged",recs.length+" records");
    render();save();openStaging();
  }
  function restore(file){
    if(file.size>MAX_IMPORT){alert("This file is "+(file.size/1048576).toFixed(1)+" MB and exceeds the v1 import limit (25 MB). Streamed large-file handling arrives in stage 2.");return;}
    var rd=new FileReader();
    rd.onload=function(){
      var obj;try{obj=JSON.parse(rd.result);}catch(e){alert("That file is not valid JSON.");return;}
      if(obj&&obj.payload&&obj.payload.ct&&obj.salt){
        pendingRestore=obj;openRestore();
      }else if(obj&&obj.state&&Array.isArray(obj.state.records)){
        if(!confirm("This is an UNENCRYPTED backup. New backups are encrypted by default. Import it anyway?"))return;
        stageRecords(obj.state.records);
      }else if(obj&&Array.isArray(obj.records)){
        stageRecords(obj.records);
      }else{alert("This does not look like a workspace backup.");}
    };
    rd.readAsText(file);
  }
  function openRestore(){
    $("#sheet").innerHTML='<div class="mhead"><span>Restore encrypted backup</span><button class="x" data-action="m-close">×</button></div>'
      +'<div class="lk" style="color:var(--faint);font-size:11px;margin-bottom:8px">Enter the passphrase this backup was created with. It is decrypted using the backup\u2019s own salt and KDF parameters \u2014 independent of your current vault \u2014 so it restores after device loss, in a new browser, or into a fresh vault.</div>'
      +'<label for="rp">Backup passphrase</label><input id="rp" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">'
      +'<div class="errbox" id="r-err"></div>'
      +'<div class="mfoot"><span class="spacer"></span><button class="btn ghost sm" data-action="m-close">Cancel</button><button class="btn sm" data-action="restore-decrypt">Decrypt &amp; stage</button></div>';
    $("#modal").classList.add("open");var ip=$("#rp");if(ip)ip.focus();
  }
  async function restoreDecrypt(){
    if(!pendingRestore){closeModal();return;}
    var p=$("#rp").value;if(!p){$("#r-err").textContent="Enter the backup passphrase.";return;}
    var b=pendingRestore,iters=(b.kdf&&b.kdf.iterations)||600000;
    try{
      var k=await Vault.derive(p,new Uint8Array(b.salt),iters);
      var d=await Vault.decWith(b.payload,k);
      var recs=(d&&Array.isArray(d.records))?d.records:null;
      if(!recs){$("#r-err").textContent="Decrypted, but no records were found in this backup.";return;}
      pendingRestore=null;closeModal();stageRecords(recs);
    }catch(e){$("#r-err").textContent="Incorrect passphrase, or the backup is corrupt.";}
  }

  /* ----- events ----- */
  function onClick(e){
    var t=e.target.closest("[data-action]");if(!t)return;
    var a=t.getAttribute("data-action"),id=t.getAttribute("data-id"),i=t.getAttribute("data-i");
    if(a==="create"){createVault();return;}
    if(a==="unlock"){unlock();return;}
    if(a==="lock"){lock();return;}
    if(a==="wipe"){wipeAll();return;}
    if(!Vault.ready())return;
    if(a==="new"){openModal(null,t.getAttribute("data-type")||null);return;}
    if(a==="edit"){openModal(id);return;}
    if(a==="m-close"){closeModal();return;}
    if(a==="m-save"){saveModal();return;}
    if(a==="m-del"){delRecord();return;}
    if(a==="cf-add"){var fw=$("#cf-fw").value,ref=$("#cf-ref").value.trim().slice(0,60);work.refs.push({fw:fw,ref:ref});$("#cf-ref").value="";renderRefs();return;}
    if(a==="cf-del"){work.refs.splice(+i,1);renderRefs();return;}
    if(a==="lk-add"){var v=$("#lk-sel").value;if(v){work.links.push(v);renderLinkSel();renderLinks();}return;}
    if(a==="lk-del"){work.links=work.links.filter(function(x){return x!==id;});renderLinkSel();renderLinks();return;}
    if(a==="activity"){openActivity();return;}
    if(a==="backup"){backup();return;}
    if(a==="restore-decrypt"){restoreDecrypt();return;}
    if(a==="stage-open"){openStaging();return;}
    if(a==="stage-commit"){commitStaged(+i);return;}
    if(a==="stage-commitall"){commitAllStaged();return;}
    if(a==="stage-discard"){state.staging.splice(+i,1);Audit.log(state,"import.discard","");openStaging();render();save();return;}
    if(a==="stage-clear"){if(confirm("Discard all staged records?")){state.staging=[];closeModal();render();save();}return;}
  }

  function boot(){
    document.addEventListener("click",onClick);
    window.addEventListener("hashchange",route);
    document.addEventListener("input",function(e){if(e.target&&e.target.id==="fq"){filter.q=e.target.value;renderRows();}});
    document.addEventListener("change",function(e){
      if(!e.target)return;
      if(e.target.id==="ftype"){filter.type=e.target.value;renderRows();return;}
      if(e.target.id==="ffw"){filter.fw=e.target.value;renderRows();return;}
      if(e.target.id==="restorein"){var f=e.target.files&&e.target.files[0];e.target.value="";if(f)restore(f);return;}
    });
    ["mousemove","keydown","click","touchstart"].forEach(function(ev){document.addEventListener(ev,function(){if(Vault.ready())resetIdle();},{passive:true});});
    Store.get("meta").then(function(meta){renderLock(!meta);});
  }
  return {boot:boot};
})();

/* the persisted 'data' record wraps the encrypted payload under .enc */
App.boot();
</script>
</body>
</html>
